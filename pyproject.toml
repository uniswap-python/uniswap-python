[tool.poetry]
name = "uniswap-python"
version = "0.9.0"  # this is automatically set in CI on tagged releases (before pushed to PyPI)
description = "An unofficial Python wrapper for the decentralized exchange Uniswap"
repository = "https://github.com/shanefontaine/uniswap-python"
readme = "README.md"
keywords = ["uniswap", "ethereum", "exchange", "trading"]
authors = ["Shane Fontaine <shane6fontaine@gmail.com>", "Erik Bjäreholt <erik@bjareho.lt>"]
license = "MIT"
packages = [
    { include = "uniswap" },
]
include = ["uniswap/assets/*.abi", "uniswap/assets/*/*.abi"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


[tool.poetry.scripts]
unipy = "uniswap:main"

[tool.poetry.dependencies]
python = "^3.12"
web3 = "^8.0.0"
cytoolz = ">=0.12.3"
frozenlist = ">=1.5.0"
multidict = ">=6.0.5"
yarl = ">=1.10.0"
click = "^8"
python-dotenv = "*"
aiohttp = ">=3.9.0"
typing-extensions = ">=4.12.0"
# eth-keyfile (via web3->eth-account) imports pkg_resources, which setuptools
# dropped in 82.0.0 (last shipped in 81.0.0). Pin below that until web3 7.x
# (which pulls in a pkg_resources-free eth-keyfile) is adopted.
setuptools = "<82"

[tool.poetry.dev-dependencies]
mypy = "*"
pre-commit = "*"
pytest = "^8.4"
pytest-cov = "*"
pytest-dotenv = "*"
pytest-asyncio = "^1.4"

ruff = ">=0.9"
Sphinx = "^9"
sphinx-book-theme = "^1.1"
sphinx-click = "*"
pydata-sphinx-theme = "*"

[tool.pytest.ini_options]
log_cli = false  # to print logs during tests, set to true
#log_level = "NOTSET"

[tool.ruff.lint]
ignore = ["E402", "E501"]

[build-system]
requires = ["poetry-core>=1.0"]
build-backend = "poetry.core.masonry.api"
